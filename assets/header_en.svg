  <circle cx="620" cy="31.2" r="2" fill="#8ec5ff"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5s" repeatCount="indefinite"/></circle>
  <path d="M0 205 Q125.0 183 250.0 205 T500 205 T750 205 T1000 205 T1250 205 T1500 205 L1500 260 L0 260 Z" fill="#ffffff" opacity="0.05">
